AWSTemplateFormatVersion: "2010-09-09"
Description: Von Neumann - delegated DNS, encrypted artifacts, and retained secrets
Parameters:
  Domain:
    Type: String
    Description: Subdomain you control; delegate the generated NS records in its parent zone
    AllowedPattern: "^[a-z0-9][a-z0-9.-]+[a-z0-9]$"
  ProjectName:
    Type: String
    Default: von-neumann
    AllowedPattern: "^[a-z][a-z0-9-]{0,31}$"
  BedrockModelId:
    Type: String
    AllowedPattern: "^[a-zA-Z0-9.:-]+$"
Resources:
  Zone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref Domain
      HostedZoneConfig:
        Comment: Delegated zone for Von Neumann Dashboard
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
  ArtifactPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub "${Artifacts.Arn}/*"]
            Condition:
              Bool:
                aws:SecureTransport: false
  AdminPassword:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod/admin-password"
      Description: Workspace login password; generated by Secrets Manager
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true
  SessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod/session-secret"
      Description: Cookie signing key; keep stable across deployments
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  ConnectorSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod/aws-connector"
      Description: Connector identity configuration; IAM temporary credentials, no static keys
      SecretString: !Sub '{"auth":"iam","region":"${AWS::Region}","instances":[],"logGroups":[],"tables":[]}'
  AiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/prod/ai"
      Description: Bedrock identity configuration; authenticated by the instance IAM role
      SecretString: !Sub '{"provider":"bedrock","region":"${AWS::Region}","model":"${BedrockModelId}"}'
Outputs:
  HostedZoneId:
    Value: !Ref Zone
  NameServers:
    Value: !Join [",", !GetAtt Zone.NameServers]
  ArtifactBucket:
    Value: !Ref Artifacts
  AdminPasswordArn:
    Value: !Ref AdminPassword
  SessionSecretArn:
    Value: !Ref SessionSecret
  ConnectorSecretArn:
    Value: !Ref ConnectorSecret
  AiSecretArn:
    Value: !Ref AiSecret
